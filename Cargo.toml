[package]
name = "hof-rs"
version = "0.1.0"
edition = "2021"
description = "Harness-of-Harness runtime for autonomous software development (Rust)"
license = "MIT"

[lib]
name = "hof_rs"
path = "src/lib.rs"

[[bin]]
name = "hoh"
path = "src/main.rs"

[dependencies]
mini-swe-agent = { path = "F:/RustProjects/mini-swe-agent-rust-mini/rust" }
anyhow = "1.0"
thiserror = "2.0"
async-trait = "0.1"
clap = { version = "4.6", features = ["derive", "env"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
tokio = { version = "1.53", features = ["fs", "macros", "rt-multi-thread", "time", "process"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ureq = { version = "2", default-features = false, features = ["json"] }
sha2 = "0.10"
walkdir = "2"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3.27"
