model:
  model_name: deepseek-v4.1-flash         # DR-14：模型身份全部来自配置，代码不再认识任何模型名
  provider: openai_compatible             # C10：必须显式，否则会被推断成 aliyun
  service_name: openai_compatible
  wire_model_name: deepseek-v4.1-flash    # DR-14 新增：上线请求体里的 model 必须逐字等于它（双重锁定）
  base_url: http://100.105.152.101:18080/v1
  # api_key 必须为空（C11/DR-16）：密钥只从环境变量 HOH_MODEL_API_KEY / OPENAI_API_KEY 读取，不入库。
  # 这里故意不写 api_key 行：写任何值都会被 assert_model_identity 判为 ModelIdentityViolation。
  use_tool_calls: true
  request_timeout_secs: 900
  max_retries: 3

agent:
  step_limit: 150                         # DR-18：60 已被第一次真实冒烟证明不够（5/5 次调用 LimitsExceeded）
  wrap_up_steps: 25                       # DR-18：剩余步数进入该阈值时必须先写出产物骨架
  repair_steps: 60                        # DR-24：冻结前「可启动闸门」失败时，一次性定向修复的步数预算
  cost_limit: 0.0
  wall_time_limit_seconds: 3600
  # mini 自己的计数器：只对**连续**的格式错误计数，任何一次成功都会把它清零。
  # 它仍然是格式错误的唯一tripwire（格式错误发生在模型层，环境的 guard 看不到），
  # 所以保留 3；真正的「同一个动作反复失败」由下面的 max_action_failures 负责。
  max_consecutive_format_errors: 3
  command_timeout_seconds: 180            # LocalEnvironment.timeout

  # ── round-1 write-path batch ────────────────────────────────────────────
  # 一次真实 round 里 developer 用了 140 次调用、54.4 分钟、10.4M token，
  # 只为了写一个**它自己已经设计好**的 Rust 文件，最后以 RepeatedFormatError 收场。
  # 下面三个值就是让这种 grind 不可能再发生：
  #
  # max_action_failures：**按动作**（而不是按连续）统计失败。同一条命令失败 3 次
  #   就立刻中止这次调用，中途的成功不会清零（round-1 里正是「偶尔成功」让
  #   max_consecutive_format_errors 永远触发不了）。3 是「足以判定该动作不可能
  #   成功」的最小值：同一命令连续 3 次同样的失败没有信息增量，第 4 次只是烧钱。
  max_action_failures: 3
  # artifact_write_budget_seconds：调用开始后，若在 900 s（15 min）内没有写出本项目
  #   的工程文件，就地中止并记 ArtifactBudgetExceeded。900 s 约为 round-1 developer
  #   全程（3264 s）的四分之一，且远高于任何一次**成功**写入的实测值（planner 72 s
  #   就写完了 plan），所以它只可能在 grind 中触发。0 表示关闭。
  artifact_write_budget_seconds: 900
  # artifact_write_budget_tokens：同一预算的 token 维度。token 只有在一次模型调用
  #   返回后才知道，环境里无法实时统计，因此这一半由 runtime 在**已记录**的 attempt
  #   上判定（role result 的 write_failures）。1_500_000 约为 round-1 developer
  #   总量（10_379_180）的七分之一，也约等于它实测每次调用 ~74k token 的 20 次调用，
  #   宽到足够一次真正的「设计 + 写文件 + 编译」，窄到不可能再花掉 10M token。0 表示关闭。
  artifact_write_budget_tokens: 1500000

  # ── round-2 cost batch ──────────────────────────────────────────────────
  # round 2 证伪了「写路径就是成本大头」：写指令确实被用上了（iter-1 22 次、
  # iter-2 9 次，零 cat/heredoc），但 developer 仍然花了 150 calls / 33 min /
  # 11.3M token 与 104 calls / 60 min / 8.3M token，每次调用的 prompt token
  # 仍是 ~74k（与 round 1 完全相同 —— 见 .spec/bevy/TRUST-REPORT.md 的
  # context 测量：代价不是 system prompt，而是**调用次数**乘上逐次累积的
  # 上下文）。真正的 grind 形状是「同一个动作**成功**地重复」：
  # iter-1 的末尾约 70 次 `cargo build --offline 2>&1` + findstr 验证循环，
  # 每一次 returncode 都是 0，所以 max_action_failures（只数失败）与
  # max_consecutive_format_errors（只数格式错误）都看不见它。
  #
  # max_repeated_actions：**同一个动作在一次调用里成功多少次**后中止。
  #   计数是「该动作在本次调用中的成功总次数」，不是连续次数：记录在案的
  #   验证循环用 `| more` / `| findstr …` / `& echo …=%ERRORLEVEL%` 等多种
  #   拼法，任何**连续**计数都看不到它。
  #   15 是**量出来的**，不是拍的：round-2 证据给出两端 —— iter-2 重复最多的
  #   动作是 `cargo build --offline 2>&1`，共 14 次，而那一轮是「最后一次构建
  #   的产物通过了闸门」的正常工程轮（每次构建之间都有编辑与不同的编译输出），
  #   所以 14 次是**合法重建节奏的上界**；iter-1 的同一动作跑了 39 次，且
  #   前半段有 22 次写、后半段只有 1 次写。15 = 严格大于 14 的最小整数，因此
  #   不可能误伤 iter-2，却会在 iter-1 上触发：按记录到的逐次 prompt token
  #   算术，第 50 次调用中止可只花掉该次调用 11,108,856 token 中的 1,703,158
  #   （15.3%）—— 证据与「它抓不到什么」都写在 tests/repeated_action.rs。
  max_repeated_actions: 15
  # steps_per_artifact：步数预算按「是否写出自己申明的产物」放行。
  #   未写出时预算为 wrap_up_steps + step_limit/steps_per_artifact
  #   = 25 + 150/8 = 43 步；第一次成功写入后恢复完整的 150 步。
  #   8 的依据：round-2 developer 的第一次写入发生在第 14 条消息（150 步的
  #   ~10%），所以 8 步/产物对「已经在干活」的角色绰绰有余，而 round-1 那种
  #   140 次调用只产出一个文件的形状会在几分钟内被中止，而不是耗掉一小时。
  #   0 表示关闭（回到固定的 150 步）。
  steps_per_artifact: 8

runtime:
  iterations: 3
  max_schema_retries: 2
  workspace: .workspace/mario
  runs_dir: runs
  spec: .spec/bevy/PRD.md
  # DR-3：只从「角色视图副本」中排除的相对路径/前缀（例如私有测试夹具）。
  # 这些路径**不**进入 hash_tree / 快照的排除集，因此不会削弱 R2/R3 的越权写入检测。
  private_excludes: []
  # DR-36：候选视图复制 `.hoh/evidence/**` 时单文件体积阈值（默认 8 MiB）。
  # 超限文件**仍会复制**并在 result.json.warnings 记 `evidence_too_large`，绝不静默跳过。
  max_evidence_bytes: 8388608

adapter:
  # DR-96: the Bevy 0.19.1 project adapter.  `hoh init` writes the observation
  # scaffold; `hoh run` builds, launches and observes a real game process, and
  # the roles reach it through the frozen tool surface on 127.0.0.1:15702.
  # `--adapter test` selects the offline suite double (`TestAdapter`), which the
  # default gate depends on.
  kind: bevy

tools:
  # Only the editor-mediated adapter uses this endpoint; a Bevy round's tools are
  # served by the game on 15702 (adapter/bevy/brp.rs).
  endpoint: http://127.0.0.1:9877/mcp
  timeout_seconds: 120
  max_retries: 2
  ready_timeout_seconds: 30               # DR-20：editor_play_scene 后轮询游戏就绪的上限
  max_sync_retries: 4                     # DR-29：JSON-RPC 响应错位时允许的只读探针次数上限
